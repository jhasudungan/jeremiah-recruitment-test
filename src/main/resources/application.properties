spring.application.name=jeremiah-recruitment-test

# --- Datasource (env vars override the defaults) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kopnus_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# --- Flyway owns the schema ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- Hibernate only validates, never alters tables ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# Base64-encoded HMAC key, at least 256 bits. Override with an env var outside local dev.
app.jwt.secret=${JWT_SECRET:VzavRKfdOC06rlGfMamlFXmJP+Ep2h2HrlHEc3lTAeA=}
app.jwt.expiration=PT15M

# --- Rate limiting (token buckets, refilled gradually over the period) ---
app.rate-limit.transfer.capacity=30
app.rate-limit.transfer.period=PT1M
app.rate-limit.login.capacity=10
app.rate-limit.login.period=PT1M